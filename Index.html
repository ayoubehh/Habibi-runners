<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Habibi Runner 💕</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a0a2e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100vh; font-family:Georgia,serif;
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
h1 { color:#ff6eb4; font-size:1.3rem; margin-bottom:6px; letter-spacing:2px; text-shadow:0 0 12px #ff6eb4aa; }
#score-display { color:#ffd6ec; font-size:0.85rem; margin-bottom:8px; }
#game-wrapper {
  position:relative; width:340px; height:420px;
  border-radius:18px; border:2px solid #ff6eb455;
  overflow:hidden; box-shadow:0 0 40px #ff6eb430;
  background:linear-gradient(180deg,#2a0d4e 0%,#3d1060 40%,#1a0535 100%);
  touch-action:none;
}
.star { position:absolute; background:white; border-radius:50%; animation:twinkle 2s infinite alternate; }
@keyframes twinkle { from{opacity:0.2}to{opacity:1} }
#ground { position:absolute; bottom:0; left:0; right:0; height:60px; background:linear-gradient(180deg,#5c2a8a,#3a1260); border-top:2px solid #ff6eb4; }
#player { position:absolute; bottom:60px; left:60px; width:56px; height:56px; border-radius:50%; border:3px solid #ff6eb4; overflow:hidden; box-shadow:0 0 16px #ff6eb4; z-index:10; }
#player img { width:100%; height:100%; object-fit:cover; object-position:center top; }
.coin { position:absolute; width:44px; height:44px; border-radius:50%; border:3px solid #ffd700; overflow:hidden; box-shadow:0 0 12px #ffd70088; z-index:8; animation:bob 0.7s infinite alternate ease-in-out; }
.coin img { width:100%; height:100%; object-fit:cover; object-position:center top; }
@keyframes bob { from{transform:translateY(0)} to{transform:translateY(-6px)} }
.obstacle { position:absolute; bottom:60px; width:32px; z-index:9; font-size:2rem; line-height:1; text-align:center; }
.particle { position:absolute; pointer-events:none; font-size:1.2rem; z-index:20; animation:floatUp 0.8s ease-out forwards; }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-50px) scale(1.5)} }
#start-screen, #gameover-screen {
  position:absolute; inset:0; background:rgba(20,5,40,0.92);
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; z-index:50; border-radius:16px;
  gap:12px; padding:20px; text-align:center;
}
#gameover-screen { display:none; }
.screen-title { color:#ff6eb4; font-size:1.5rem; text-shadow:0 0 14px #ff6eb4; }
.screen-sub { color:#ffd6ec; font-size:0.88rem; line-height:1.5; }
.tap-btn { margin-top:6px; background:linear-gradient(135deg,#ff6eb4,#c23ed4); color:white; border:none; padding:13px 30px; border-radius:30px; font-size:1rem; font-family:Georgia,serif; cursor:pointer; box-shadow:0 4px 18px #ff6eb466; letter-spacing:1px; }
.tap-btn:active { transform:scale(0.95); }
.face-preview { width:58px; height:58px; border-radius:50%; border:3px solid #ffd700; overflow:hidden; box-shadow:0 0 14px #ffd700; }
.face-preview img { width:100%; height:100%; object-fit:cover; object-position:center top; }
#final-score { color:#ffd700; font-size:1.3rem; }
#hud { position:absolute; top:10px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; z-index:15; }
.hud-item { color:#ffd6ec; font-size:0.85rem; }
.hud-score { color:#ffd700; font-weight:bold; font-size:1rem; }
</style>
</head>

<script>
const AYOUB_B64 = "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAAtAFADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDl3tZ555P3MiylthMgwFA5OACecEceg9ail0/yJbkGWKNUQSZKH52PTBPVQQRkdq3Vdbq6mSJZUmRUO2f7qEhh65z07elZupQ4t2VmuWkilYYlQfMucg8cDqTj3rNopM5nWtDMiNdQqPNycgH74H9cn8q520Z4rpJI5PLlQ5UkdT6Gusm1qzjnCSSM8fzcoCQue46Z6DrWJJbRavIXtT5dwxJaNxgN7gjvQnZajtroaVzefaIrcQFVaR1VlB5X1H0461r6VN9n1OzuMIXR2UbxjjB3Z/Dn6gVzNjZXNnewi9tZAm8bJCMhW7c/0ro3kjtopWcENDbTSMAcZJ+UD2ojNwalF6nLjnKNJ20ZG3iaXxDdEyW6RQ267Y33EsQWJANaUY85FU3IjjyMlUycVhafZxQHdCcI6KCCxySM5NafkXcablQunqvzfyrnqSvUcu+vz6n2uTxcMJFW/q5ta/4egtoYGsJmkj5DSP1YkZH0rmZbOaIZJBHsa0pr2+ubSOF2ZY48kk55/wD1VXR7EKczMWPUtTdm7o6adNqPLJ6nXy6hYqr7UPmRYDMvzbSenuT047fjXOeKtX3acEtIniafL3B+6zDhcEfpVllSQkhNhOJHZBjI6L0HB4/hJ6Vj6uEGx2RZZwQpJbJIOe+fXH+FdGtz4nYw9J0d9VnkjiyoTDFm649K3L5G0mCG3RDCMsCQMZbAx9e9bfgJbe4uLl2MazPIIVX8M1seLlXQtSsZbi3/ALRjcMXhmXhACBkY6daxmm5eR10rKN+pzF1Pb+QpR2JVRubsv1NZ8vnbpY3jwzYR1YZ3dCAc/hXrzWGk3enxJBpMaLMqs3y8r0OMfpVC/wDC8E9083khIiyk44wF/l2/Ko5bHTzQlpNHm2m276nM8Sjy2AYHI6MBwKs2UuBGJAY3dco44z6iu3tNE06wsJ7gzRyK0pYiKQN8x6LkVzc1lC0Atyeeqn+6aXKe1lMpShLshVkVhtlw3bJHNZl/okUoMtucHuB0pZIbyEfOoIHG7rmnxTyxkMCQD2Pemj0pTjLSSNUWxlCN5m9mO/jggduOD7/Kagv9PF3ZsgLeezhlBO7BOOPxx9eOldDPCpYAqpVl3lTnuSCAc5HTI54qvewqLNLhixDSGPA4PHQk9 // Stars
const wrapper = document.getElementById('game-wrapper');
for(let i=0;i<28;i++){
  const s=document.createElement('div');
  s.className='star';
  const sz=Math.random()*2+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*65}%;animation-delay:${Math.random()*2}s;animation-duration:${1+Math.random()*2}s`;
  document.getElementById('stars').appendChild(s);
}

let score=0,lives=3,level=1,gameRunning=false;
let playerY=0,velY=0,jumping=false,doubleJumped=false;
let coins=[],obstacles=[],spawnTimer=0,coinTimer=0,elapsed=0,speed=3;
let frameId,lastTime=0;
const GROUND=60;
const playerEl=document.getElementById('player');

function startGame(){
  score=0;lives=3;level=1;speed=3;
  playerY=0;velY=0;jumping=false;doubleJumped=false;
  coins=[];obstacles=[];spawnTimer=0;coinTimer=0;elapsed=0;
  document.querySelectorAll('.coin,.obstacle,.particle').forEach(e=>e.remove());
  document.getElementById('start-screen').style.display='none';
  document.getElementById('gameover-screen').style.display='none';
  document.getElementById('score-live').textContent='0';
  document.getElementById('lives-display').textContent='3';
  document.getElementById('level-display').textContent='1';
  gameRunning=true;lastTime=0;
  cancelAnimationFrame(frameId);
  frameId=requestAnimationFrame(loop);
}

function jump(){
  if(!gameRunning)return;
  if(!jumping){velY=-14;jumping=true;doubleJumped=false;}
  else if(!doubleJumped){velY=-11;doubleJumped=true;}
}

wrapper.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
wrapper.addEventListener('mousedown',jump);

function loop(ts){
  if(!gameRunning)return;
  const dt=lastTime?Math.min((ts-lastTime)/16.67,3):1;
  lastTime=ts;elapsed+=dt;
  level=1+Math.floor(elapsed/500);
  speed=3+(level-1)*0.7;
  document.getElementById('level-display').textContent=level;

  velY+=0.8*dt;
  playerY+=velY*dt;
  if(playerY>=0){playerY=0;velY=0;jumping=false;doubleJumped=false;}
  playerEl.style.bottom=(GROUND+(-playerY))+'px';

  coinTimer+=dt;
  if(coinTimer>Math.max(50,85-level*4)){coinTimer=0;spawnCoin();}
  spawnTimer+=dt;
  if(spawnTimer>Math.max(65,110-level*5)){spawnTimer=0;if(Math.random()<0.7)spawnObs();}

  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.x-=speed*dt;c.el.style.left=c.x+'px';
    if(Math.abs(c.x-60)<38&&Math.abs(c.y-(GROUND+(-playerY)))<38){
      spawnParticle(c.x+22,c.y+22,'💛');c.el.remove();coins.splice(i,1);
      score++;document.getElementById('score-live').textContent=score;continue;
    }
    if(c.x<-60){c.el.remove();coins.splice(i,1);}
  }

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=speed*dt;o.el.style.left=o.x+'px';
    if(Math.abs(o.x-60)<24&&(-playerY)<40){
      spawnParticle(o.x,GROUND+20,'💥');o.el.remove();obstacles.splice(i,1);
      lives--;document.getElementById('lives-display').textContent=lives;
      if(lives<=0){gameOver();return;}continue;
    }
    if(o.x<-60){o.el.remove();obstacles.splice(i,1);}
  }
  frameId=requestAnimationFrame(loop);
}

function spawnCoin(){
  const el=document.createElement('div');el.className='coin';
  const yOff=Math.random()<0.4?85:18;
  el.style.cssText=`left:360px;bottom:${GROUND+yOff}px;`;
  el.innerHTML=`<img src="data:image/jpeg;base64,${AYOUB_B64}" alt="habibi">`;
  wrapper.appendChild(el);
  coins.push({el,x:360,y:GROUND+yOff});
}

function spawnObs(){
  const el=document.createElement('div');el.className='obstacle';
  el.textContent=['🌵','🔥','💀','⚡','🌪️'][Math.floor(Math.random()*5)];
  el.style.left='360px';wrapper.appendChild(el);
  obstacles.push({el,x:360});
}

function spawnParticle(x,y,emoji){
  const el=document.createElement('div');el.className='particle';
  el.textContent=emoji;el.style.cssText=`left:${x}px;bottom:${y}px;`;
  wrapper.appendChild(el);setTimeout(()=>el.remove(),800);
}

function gameOver(){
  gameRunning=false;cancelAnimationFrame(frameId);
  document.getElementById('final-score').textContent=`🪙 ${score} Habibi Coins`;
  const msg=score<5?"¡Sigue intentándolo, habibi! 😘":score<15?"¡No está mal! Pero yo merezco más coins 😏":score<30?"¡Eso es! Me estás queriendo mucho 💕":"¡Eres increíble! Te amo muchísimo 😍❤️";
  document.getElementById('gameover-msg').textContent=msg;
  document.getElementById('gameover-screen').style.display='flex';
}
</script>
