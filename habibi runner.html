<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Habibi Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ff4d8d;
  --gold: #f5c842;
  --deep: #0d0520;
  --mid: #1e0a3c;
  --light-pink: #ffb3d1;
  --glow-pink: rgba(255,77,141,0.4);
  --glow-gold: rgba(245,200,66,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--deep); }
body {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'DM Sans',sans-serif; user-select:none; -webkit-user-select:none;
  background: radial-gradient(ellipse at 50% 0%, #2a0845 0%, var(--deep) 65%);
}

/* Header */
#header { text-align:center; margin-bottom:10px; }
#header h1 {
  font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:700;
  background: linear-gradient(135deg, var(--pink), var(--gold));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  letter-spacing:1px; line-height:1.1;
}
#header p { color:var(--light-pink); font-size:0.72rem; font-weight:300; letter-spacing:3px; text-transform:uppercase; margin-top:2px; opacity:0.7; }

/* Game canvas */
#wrap {
  position:relative; width:340px; height:440px;
  border-radius:20px;
  border:1px solid rgba(255,77,141,0.3);
  overflow:hidden;
  box-shadow: 0 0 60px rgba(255,77,141,0.2), 0 0 120px rgba(255,77,141,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
}

/* Sky gradient layers */
#sky {
  position:absolute; inset:0;
  background: linear-gradient(180deg,
    #060115 0%,
    #0f032a 25%,
    #1a0535 55%,
    #2d0f50 75%,
    #3d1860 100%
  );
}

/* Parallax clouds / nebula */
.nebula { position:absolute; border-radius:50%; filter:blur(40px); pointer-events:none; }

/* Stars */
.star { position:absolute; background:white; border-radius:50%; animation:twinkle var(--dur,2s) var(--del,0s) infinite alternate ease-in-out; }
@keyframes twinkle { 0%{opacity:0.1;transform:scale(0.8)} 100%{opacity:var(--op,0.9);transform:scale(1.1)} }

/* Ground */
#ground {
  position:absolute; bottom:0; left:0; right:0; height:68px;
  background: linear-gradient(180deg, #3d1860 0%, #1e0840 100%);
  border-top:1px solid rgba(255,77,141,0.5);
  overflow:hidden;
}
/* Ground glow line */
#ground::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--pink), transparent);
  box-shadow: 0 0 12px var(--pink), 0 0 24px var(--glow-pink);
  animation: scanline 3s linear infinite;
}
@keyframes scanline { 0%{opacity:0.4} 50%{opacity:1} 100%{opacity:0.4} }

/* Ground tiles */
#gtiles {
  position:absolute; bottom:0; left:0; height:68px;
  display:flex; width:200%;
  animation: scroll-ground linear infinite;
  animation-duration: 2s;
}
.gtile {
  flex-shrink:0; height:100%;
  background:
    repeating-linear-gradient(90deg, rgba(255,77,141,0.06) 0px, rgba(255,77,141,0.06) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 20px);
}
@keyframes scroll-ground { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

/* Player */
#player {
  position:absolute; left:55px; width:58px; height:58px;
  border-radius:50%; overflow:hidden; z-index:10;
  border:2.5px solid var(--pink);
  box-shadow: 0 0 0 3px rgba(255,77,141,0.15), 0 0 20px var(--glow-pink), 0 0 40px rgba(255,77,141,0.15);
  transition: box-shadow 0.1s;
}
#player img { width:100%; height:100%; object-fit:cover; object-position:center top; }
#player.hurt { border-color:#ff0000; box-shadow:0 0 0 4px rgba(255,0,0,0.3), 0 0 30px rgba(255,0,0,0.6); }

/* Coins — heart shape with face inside */
.coin {
  position:absolute; z-index:8;
  width:46px; height:46px;
  display:flex; align-items:center; justify-content:center;
  animation: floatCoin 1.2s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 8px var(--glow-gold));
}
@keyframes floatCoin { 0%{transform:translateY(0) rotate(-3deg)} 100%{transform:translateY(-7px) rotate(3deg)} }
.coin .heart-clip {
  width:44px; height:44px; position:relative; overflow:hidden;
  clip-path: path('M22 40 C22 40 2 26 2 14 C2 7 7 2 14 2 C17.5 2 21 4 22 7 C23 4 26.5 2 30 2 C37 2 42 7 42 14 C42 26 22 40 22 40Z');
  border: none;
  background: var(--gold);
}
.coin .heart-clip img { width:100%; height:100%; object-fit:cover; object-position:center top; }
.coin .heart-outline {
  position:absolute; inset:0; pointer-events:none;
  filter: drop-shadow(0 0 6px var(--gold));
}

/* Obstacles */
.obs { position:absolute; z-index:9; font-size:0; display:flex; align-items:center; justify-content:center; }
.obs svg { width:100%; height:100%; }
/* Bird */
.obs-bird { width:50px; height:30px; }
/* Cactus */
.obs-cactus { width:32px; height:52px; }
/* Plane */
.obs-plane { width:60px; height:32px; }

/* Particles */
.fx { position:absolute; pointer-events:none; z-index:25; animation:pop 0.75s ease-out forwards; font-size:1.3rem; }
@keyframes pop { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-55px) scale(1.8)} }
.score-pop { position:absolute; pointer-events:none; z-index:25; animation:scorepop 0.6s ease-out forwards;
  font-family:'Playfair Display',serif; font-size:0.95rem; color:var(--gold); font-style:italic; }
@keyframes scorepop { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }

/* HUD */
#hud { position:absolute; top:0; left:0; right:0; height:44px; z-index:15; display:flex; align-items:center; justify-content:space-between; padding:0 14px;
  background: linear-gradient(180deg, rgba(5,1,20,0.85) 0%, transparent 100%);
}
.hud-pill {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:20px; padding:4px 10px; display:flex; align-items:center; gap:5px;
}
.hud-label { color:rgba(255,255,255,0.45); font-size:0.65rem; font-weight:300; text-transform:uppercase; letter-spacing:1px; }
.hud-val { color:white; font-size:0.88rem; font-weight:500; min-width:16px; text-align:center; }
.hud-val.gold { color:var(--gold); font-family:'Playfair Display',serif; font-size:1rem; }

/* Screens */
.screen {
  position:absolute; inset:0; z-index:50; border-radius:19px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:13px; padding:24px 28px; text-align:center;
  background: linear-gradient(180deg, rgba(8,1,25,0.97) 0%, rgba(18,3,40,0.97) 100%);
  backdrop-filter:blur(12px);
}
.screen-logo {
  font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; line-height:1;
  background:linear-gradient(135deg, var(--pink) 0%, #ff8ac0 50%, var(--gold) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.screen-sub {
  font-size:0.82rem; font-weight:300; color:rgba(255,200,225,0.75);
  line-height:1.65; max-width:260px;
}
.screen-sub b { color:var(--gold); font-weight:500; -webkit-text-fill-color:var(--gold); }
.screen-sub small { font-size:0.72rem; color:rgba(255,180,210,0.5); letter-spacing:0.5px; }
.avatar-row { display:flex; align-items:center; gap:10px; }
.av {
  width:62px; height:62px; border-radius:50%; overflow:hidden;
  border:2px solid var(--pink);
  box-shadow:0 0 0 3px rgba(255,77,141,0.12), 0 0 18px var(--glow-pink);
}
.av img { width:100%; height:100%; object-fit:cover; object-position:center top; }
.av.gold-border { border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,200,66,0.12), 0 0 18px var(--glow-gold); }
.av-label { font-size:0.65rem; color:rgba(255,180,210,0.6); letter-spacing:1px; text-transform:uppercase; margin-top:4px; font-weight:300; }
.av-wrap { display:flex; flex-direction:column; align-items:center; }
.heart-sep { font-size:1.3rem; color:var(--pink); animation:beat 1s ease-in-out infinite; }
@keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
.btn {
  background:linear-gradient(135deg, var(--pink), #c0287a);
  color:white; border:none; padding:14px 36px; border-radius:30px;
  font-size:0.95rem; font-family:'DM Sans',sans-serif; font-weight:500;
  cursor:pointer; letter-spacing:0.5px;
  box-shadow:0 4px 20px rgba(255,77,141,0.4), 0 1px 0 rgba(255,255,255,0.15) inset;
  transition:transform 0.1s, box-shadow 0.1s;
  -webkit-appearance:none;
}
.btn:active { transform:scale(0.96); box-shadow:0 2px 10px rgba(255,77,141,0.3); }
.divider { width:80px; height:1px; background:linear-gradient(90deg,transparent,rgba(255,77,141,0.3),transparent); }
.hint { font-size:0.68rem; color:rgba(255,180,210,0.4); letter-spacing:1.5px; text-transform:uppercase; }

/* Game over specific */
#fscore { font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--gold); }
#fmsg { font-size:0.85rem; color:var(--light-pink); font-style:italic; font-family:'Playfair Display',serif; line-height:1.5; }
.score-stars { font-size:1.1rem; letter-spacing:2px; }

/* Combo flash */
#combo { position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:20;
  font-family:'Playfair Display',serif; font-style:italic; font-size:1.1rem;
  color:var(--gold); text-shadow:0 0 20px var(--gold); pointer-events:none;
  opacity:0; transition:opacity 0.2s;
}
#combo.show { opacity:1; animation:comboAnim 0.8s ease-out forwards; }
@keyframes comboAnim { 0%{opacity:1;transform:translateX(-50%) scale(1)} 60%{transform:translateX(-50%) scale(1.15)} 100%{opacity:0;transform:translateX(-50%) scale(1)} }
</style>
</head>

// State
var score,lives,level,running,playerY,velY,jumping,dj;
var coins,obs,spawnT,coinT,elapsed,speed,rafId,lastT,combo,hurtTimer;
var GND=68, PWID=58, PHGT=58;

function init(){
  score=0;lives=3;level=1;speed=3.2;running=false;combo=0;hurtTimer=0;
  playerY=0;velY=0;jumping=false;dj=false;
  coins=[];obs=[];spawnT=0;coinT=0;elapsed=0;rafId=null;lastT=0;
  wrap.querySelectorAll(".coin,.obs,.fx,.score-pop").forEach(function(e){e.remove();});
  document.getElementById("hscore").textContent="0";
  document.getElementById("hlives").textContent="3";
  document.getElementById("hlevel").textContent="1";
  playerEl.style.bottom=GND+"px";
  playerEl.className="";
  gtiles.style.animationDuration="1.8s";
}

function startGame(){
  init();
  document.getElementById("sstart").style.display="none";
  document.getElementById("sover").style.display="none";
  running=true; lastT=0;
  rafId=requestAnimationFrame(loop);
}

document.getElementById("btnstart").addEventListener("click",startGame);
document.getElementById("btnstart").addEventListener("touchend",function(e){e.preventDefault();startGame();},{passive:false});
document.getElementById("btnrestart").addEventListener("click",startGame);
document.getElementById("btnrestart").addEventListener("touchend",function(e){e.preventDefault();startGame();},{passive:false});

function doJump(){
  if(!running) return;
  if(!jumping){ velY=-15; jumping=true; dj=false; }
  else if(!dj){ velY=-12; dj=true; }
}
wrap.addEventListener("touchstart",function(e){e.preventDefault();doJump();},{passive:false});
wrap.addEventListener("mousedown",doJump);

function loop(ts){
  if(!running) return;
  var dt=lastT?Math.min((ts-lastT)/16.67,3):1;
  lastT=ts; elapsed+=dt;

  // Level
  var newLvl=1+Math.floor(elapsed/520);
  if(newLvl!==level){ level=newLvl; document.getElementById("hlevel").textContent=level; }
  speed=3.2+(level-1)*0.6;
  // Sync ground scroll
  var dur=Math.max(0.6, 1.8-((level-1)*0.15));
  gtiles.style.animationDuration=dur+"s";

  // Hurt timer
  if(hurtTimer>0){ hurtTimer-=dt; if(hurtTimer<=0) playerEl.className=""; }

  // Physics
  velY+=0.82*dt; playerY+=velY*dt;
  if(playerY>=0){ playerY=0; velY=0; jumping=false; dj=false; }
  playerEl.style.bottom=(GND+(-playerY))+"px";

  // Spawn coins
  coinT+=dt;
  var ci=Math.max(45,80-level*4);
  if(coinT>ci){ coinT=0; mkCoin(); }

  // Spawn obstacles
  spawnT+=dt;
  var oi=Math.max(60,105-level*5);
  if(spawnT>oi){ spawnT=0; if(Math.random()<0.72) mkObs(); }

  // Coins
  for(var i=coins.length-1;i>=0;i--){
    var c=coins[i]; c.x-=speed*dt; c.el.style.left=c.x+"px";
    var py=GND+(-playerY);
    // Collect
    if(Math.abs((c.x+23)-(55+29))<40 && Math.abs((c.y+23)-py)<42){
      fx(c.x+10,c.y+30,"💛");
      scorePop(c.x+10,c.y+50,"+1");
      c.el.remove(); coins.splice(i,1);
      score++; combo++;
      document.getElementById("hscore").textContent=score;
      if(combo>=3){ showCombo(); }
      continue;
    }
    if(c.x<-60){ c.el.remove(); coins.splice(i,1); combo=0; }
  }

  // Obstacles
  for(var j=obs.length-1;j>=0;j--){
    var o=obs[j]; o.x-=speed*dt; o.el.style.left=o.x+"px";
    var px2=55, py2=GND+(-playerY);
    var hit=false;
    if(o.type==="cactus"){
      hit=Math.abs(o.x-px2)<22 && (-playerY)<45;
    } else if(o.type==="bird"){
      hit=Math.abs(o.x-px2)<36 && Math.abs((o.ybot-15)-(py2-30))<28;
    } else if(o.type==="plane"){
      hit=Math.abs(o.x-px2)<48 && Math.abs((o.ybot-16)-(py2-30))<30;
    }
    if(hit && hurtTimer<=0){
      fx(o.x+15,py2+10,"💔");
      o.el.remove(); obs.splice(j,1);
      lives--; combo=0;
      document.getElementById("hlives").textContent=lives;
      playerEl.className="hurt"; hurtTimer=30;
      if(lives<=0){ gameOver(); return; }
      continue;
    }
    if(o.x<-80){ o.el.remove(); obs.splice(j,1); }
  }

  rafId=requestAnimationFrame(loop);
}

function mkCoin(){
  var el=document.createElement("div"); el.className="coin";
  var yOff=Math.random()<0.4?90:14;
  var bot=GND+yOff;
  el.style.cssText="left:355px;bottom:"+bot+"px;";
  el.innerHTML=coinHTML();
  wrap.appendChild(el);
  coins.push({el:el,x:355,y:bot});
}

var OBSTACLE_TYPES=["cactus","cactus","bird","bird","plane"];
function mkObs(){
  var type=OBSTACLE_TYPES[Math.floor(Math.random()*OBSTACLE_TYPES.length)];
  var el=document.createElement("div"); el.className="obs obs-"+type;
  var bot;
  if(type==="cactus"){
    el.innerHTML=cactSVG(); el.style.width="32px"; el.style.height="52px";
    bot=GND; el.style.bottom=bot+"px";
  } else if(type==="bird"){
    el.innerHTML=birdSVG(); el.style.width="50px"; el.style.height="30px";
    var birdH=Math.random()<0.5?GND+30:GND+80;
    bot=birdH; el.style.bottom=bot+"px";
  } else {
    el.innerHTML=planeSVG(); el.style.width="60px"; el.style.height="32px";
    bot=GND+110+Math.random()*40; el.style.bottom=bot+"px";
  }
  el.style.left="360px";
  wrap.appendChild(el);
  obs.push({el:el,x:360,type:type,ybot:bot});
}

function fx(x,y,em){
  var el=document.createElement("div"); el.className="fx";
  el.textContent=em; el.style.cssText="left:"+x+"px;bottom:"+y+"px;";
  wrap.appendChild(el); setTimeout(function(){el.remove();},800);
}
function scorePop(x,y,txt){
  var el=document.createElement("div"); el.className="score-pop";
  el.textContent=txt; el.style.cssText="left:"+x+"px;bottom:"+y+"px;";
  wrap.appendChild(el); setTimeout(function(){el.remove();},650);
}
function showCombo(){
  comboEl.textContent="x"+combo+" Combo! ✨";
  comboEl.classList.remove("show");
  void comboEl.offsetWidth;
  comboEl.classList.add("show");
  setTimeout(function(){comboEl.classList.remove("show");},900);
}

function gameOver(){
  running=false; cancelAnimationFrame(rafId);
  var stars=score<5?"⭐":score<15?"⭐⭐":score<30?"⭐⭐⭐":"⭐⭐⭐⭐";
  var msgs=[
    [0,4,"Vuelve a intentarlo... seguro que puedes más. 💪"],
    [5,14,"Nada mal. Pero sé que me quieres más que eso. 😏"],
    [15,29,"Así me gusta. ¿Ves cómo me buscas? 💕"],
    [30,999,"Para, para... demasiado amor para mi corazón. 😍❤️"]
  ];
  var msg="";
  for(var k=0;k<msgs.length;k++){
    if(score>=msgs[k][0]&&score<=msgs[k][1]){msg=msgs[k][2];break;}
  }
  document.getElementById("fstars").textContent=stars;
  document.getElementById("fscore").textContent=score+" Habibi Coins";
  document.getElementById("fmsg").textContent=msg;
  document.getElementById("sover").style.display="flex";
}

})();
</script>
</body>
</html>
